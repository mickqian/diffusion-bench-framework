name: Mirror nightly data into Pages

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-nightly
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate recent nightly runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/mirror_nightly_data.py
      - name: Commit snapshot when it changed
        id: commit
        run: |
          if git diff --quiet docs/nightly-data.json; then
            echo "snapshot unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/nightly-data.json
          git commit -m "chore: refresh nightly data snapshot [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # [skip ci] keeps the commit from re-running the test workflows, but it
      # also suppresses the Pages deploy, so the refreshed snapshot would sit in
      # the repo and never reach the site. Trigger the deploy explicitly, and
      # pin the SHA: dispatching seconds after the push can still resolve
      # `main` to the pre-push commit and deploy a tree without the snapshot
      # (observed 2026-08-13: commit 03:03:52, dispatch 03:03:55 → old SHA).
      - name: Deploy the refreshed snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main -f sha="$(git rev-parse HEAD)"
